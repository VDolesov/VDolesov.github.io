<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Мир Сладостей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;600&display=swap">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#15100f; color:#f1eae3;
         font-family:Inter, "Segoe UI", sans-serif; text-align:center; padding:40px 20px; box-sizing:border-box; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:500; font-size:clamp(34px,5vw,56px); margin:0 0 14px; }
  p { color:rgba(241,234,227,.6); margin:0 0 30px; font-size:16px; line-height:1.6; }
  a { display:inline-block; padding:15px 34px; border-radius:999px; background:#a8213c; color:#fff;
      text-decoration:none; font-weight:600; font-size:14px; }
  a:hover { background:#c42b4c; }
  .label { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#c2a15f; margin-bottom:18px; }
</style>
</head>
<body>
<div>
  <div class="label">Ошибка 404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка.</p>
  <a href="/">На главную</a>
</div>
</body>
</html>
