<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Мир Сладостей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;600&display=swap">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#120b08; color:#f3e8d8;
         font-family:"Golos Text", "Segoe UI", sans-serif; text-align:center; padding:40px 20px; box-sizing:border-box; }
  h1 { font-family:Prata, Georgia, serif; font-weight:400; font-size:clamp(34px,5vw,56px); margin:0 0 14px; }
  p { color:rgba(243,232,216,.6); margin:0 0 30px; font-size:16px; line-height:1.6; }
  a { display:inline-block; padding:18px 34px; background:#d6a459; color:#120b08; text-decoration:none;
      font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
  a:hover { background:#e6b96f; }
  .label { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#d6a459; margin-bottom:18px; }
</style>
</head>
<body>
<div>
  <div class="label">Ошибка 404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка.</p>
  <a href="/">На главную</a>
</div>
</body>
</html>
